# cargo-deny configuration for Heimdall
#
# Allows the licenses used by the dependency graph and records allowances for
# advisories that cannot be remediated by upgrading (unmaintained crates merged
# into upstream projects, or where no safe upgrade exists).

[licenses]
allow = [
    # Permissive, OSI-approved, FSF Free/Libre
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "Zlib",
    "BSD-1-Clause",
    "LGPL-2.1-or-later",
    "BSL-1.0",
    # Font / content licenses (not code, but used by dependency assets)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
]

[bans]
# crates that are yanked but still required by the dependency graph
skip = [
    # clipboard-win 5.4.1 is yanked but required by arboard → egui-winit → eframe
    # No newer version exists that arboard depends on; upgrading arboard/eframe
    # is a larger migration. The crate is only used on Windows clipboard.
    { name = "clipboard-win", version = "5.4.1", reason = "yanked but required by arboard/eframe; no newer compatible version" },
]

[advisories]
# Ignore advisories that cannot be remediated by upgrading:
#
# zbus ecosystem crates (zbus_names, zvariant, zvariant_derive, zvariant_utils,
# paste) are unmaintained but merged into zbus 6.0.0. Upgrading zbus from 4.x
# to 6.x is a breaking API change requiring reworking the D-Bus integration in
# accesskit_windows / accesskit_winit / egui-winit. Allowed pending a larger
# migration; these crates are only used on Linux for accessibility.
#
# ttf-parser is unmaintained but structurally simple; used transitively through
# ab_glyph → epaint → egui. Alternative skrifa exists but requires reworking
# text rendering.
#
# quick-xml 0.30.0 has two vulnerabilities (RUSTSEC-2026-0194, RUSTSEC-2026-0195)
# fixed in 0.41.0, but upgrading requires the deep zbus_xml → zbus-lockstep →
# atspi-common → accesskit chain through the GUI stack. quick-xml only parses
# local D-Bus introspection XML, not untrusted network input.
ignore = [
    "RUSTSEC-2026-0371",  # zbus_names
    "RUSTSEC-2026-0370",  # zvariant
    "RUSTSEC-2026-0372",  # zvariant_derive / zvariant_utils
    "RUSTSEC-2024-0436",  # paste
    "RUSTSEC-2026-0192",  # ttf-parser
    "RUSTSEC-2026-0194",  # quick-xml
    "RUSTSEC-2026-0195",  # quick-xml
]
