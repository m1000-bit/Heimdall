[package]
name = "heimdall-ipc"
description = "Authenticated inter-AI transport for Heimdall Core and Sentinel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Exposes an in-process duplex transport. Used by tests and by the single-process
# development mode where Core and Sentinel run in one binary.
in-memory = []

[dependencies]
heimdall-crypto.workspace = true
thiserror.workspace = true
bytes.workspace = true
zeroize.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "time"] }