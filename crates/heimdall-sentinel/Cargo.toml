[package]
name = "heimdall-sentinel"
description = "Heimdall Sentinel: defense engine for host and network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "heimdall-sentinel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
heimdall-crypto.workspace = true
heimdall-ipc.workspace = true

thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

# One cross-platform telemetry implementation, so a stream means the same thing
# on Linux, macOS and Windows and the learned baselines stay comparable.
sysinfo = "0.39"
tokio.workspace = true

[dev-dependencies]
# The end-to-end test drives Core's side of the channel. heimdall-core does not
# depend on this crate, so there is no cycle.
heimdall-core.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }