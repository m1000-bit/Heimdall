[package]
name = "heimdall-voice"
description = "Heimdall voice pipeline: capture, voice activity detection, recognition seam, local speech."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal = { workspace = true, optional = true }

[features]
default = ["capture"]
# Microphone capture through the platform audio API. On Linux this needs
# libasound2-dev at build time; every other backend is pure Rust.
capture = ["dep:cpal"]
