[workspace]
resolver = "3"
members = [
    "crates/heimdall-crypto",
    "crates/heimdall-ipc",
    "crates/heimdall-core",
    "crates/heimdall-sentinel",
    "crates/heimdall-shell",
    "crates/heimdall-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/heimdall-os/heimdall"
authors = ["Heimdall Contributors"]

[workspace.dependencies]
heimdall-crypto = { path = "crates/heimdall-crypto", version = "0.1.0" }
heimdall-ipc = { path = "crates/heimdall-ipc", version = "0.1.0" }
heimdall-core = { path = "crates/heimdall-core", version = "0.1.0" }
heimdall-sentinel = { path = "crates/heimdall-sentinel", version = "0.1.0" }
heimdall-voice = { path = "crates/heimdall-voice", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
bytes = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
subtle = "2"
aead = "0.5"
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
egui-wgpu = "0.31"
egui_extras = "0.31"
wgpu = "26"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic entries that fight intentional crypto/memory-safety idioms.
undocumented_unsafe_blocks = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
# Noisy on a crate whose surface is mostly small accessors.
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"