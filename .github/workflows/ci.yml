name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Caching the registry and target directory matters here: the wgpu and
      # eframe trees are large and unchanged between most commits.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The voice pipeline captures the microphone through the platform audio
      # API. On Linux that API is ALSA, whose headers are not installed on the
      # runner images.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --no-deps

  miri:
    name: miri (undefined behaviour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Restricted to the pure-Rust cryptographic core and the protocol codec.
      # Neither opens sockets or files, which is what keeps them runnable under
      # the interpreter at all.
      - name: miri on heimdall-crypto and heimdall-ipc
        run: |
          cargo miri test -p heimdall-crypto
          cargo miri test -p heimdall-ipc --lib

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # Heimdall ships a cryptographic core; a known-vulnerable transitive
      # dependency is a security defect here in a way it would not be for a
      # typical application.
      - run: cargo install cargo-deny --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  build:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo build --release --workspace

  deploy:
    name: deployment artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The service definitions are part of the product: a unit that does not
      # parse is a deployment that does not start, and nobody notices until a
      # machine is down. They are checked here instead.
      - name: Install the checking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libxml2-utils

      - name: Shell scripts
        run: shellcheck deploy/systemd/install.sh deploy/launchd/install.sh

      - name: Service definitions
        run: |
          xmllint --noout deploy/launchd/com.heimdall.sentinel.plist
          xmllint --noout deploy/windows/heimdall-sentinel-task.xml
          # The unit refers to files that only exist on a deployed machine.
          sudo touch /usr/local/bin/heimdall-sentinel
          sudo chmod +x /usr/local/bin/heimdall-sentinel
          sudo touch /etc/heimdall/passphrase
          systemd-analyze verify deploy/systemd/heimdall-sentinel.service
